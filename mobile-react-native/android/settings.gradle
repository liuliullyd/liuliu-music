pluginManagement { includeBuild("../node_modules/@react-native/gradle-plugin") }
plugins { id("com.facebook.react.settings") }
extensions.configure(com.facebook.react.ReactSettingsExtension) { ex ->
    // Resolve the installed CLI directly; autolinking must not invoke npx or a shell.
    def node = providers.environmentVariable('NODE_BINARY').getOrElse('node')
    ex.autolinkLibrariesFromCommand([node, file('../node_modules/@react-native-community/cli/build/bin.js').absolutePath, 'config'])
}
rootProject.name = 'LiuliuMusic'
include ':app'
includeBuild('../node_modules/@react-native/gradle-plugin')
